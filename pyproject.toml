[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spectralens"
version = "0.1.0"
description = "Spectral and low-rank analysis of vision networks with from-scratch numerical linear algebra"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Huy Pham" }]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "scipy>=1.13",
  "hydra-core>=1.3",
  "mlflow>=2.14",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
]

[project.scripts]
spectralens = "spectralens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spectralens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs a GPU or takes more than a few seconds"]
